<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting&hellip;</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/games" />
    <link rel="canonical" href="/games" />
    <script>
      // Preserve any query string / hash on the way through.
      location.replace('/games' + location.search + location.hash)
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="/games">/games</a>&hellip;</p>
  </body>
</html>
